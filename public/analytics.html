<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Screeps Mission Control</title>
    <link rel="stylesheet" href="css/mission-control.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        .analytics-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .date-selector {
            display: flex;
            gap: 10px;
        }
        
        .date-selector button {
            padding: 8px 16px;
            background: #2a2a2a;
            border: 1px solid #00ff00;
            color: #00ff00;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        .date-selector button.active {
            background: #00ff00;
            color: #000;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            padding: 20px;
            border-radius: 4px;
        }
        
        .chart-title {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 50px;
        }
        
        .admin-link {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #2a2a2a;
            border: 1px solid #00ff00;
            color: #00ff00;
            text-decoration: none;
            font-family: 'Courier New', monospace;
        }
        
        .admin-link:hover {
            background: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>
    <a href="/colony_management.html" class="admin-link">🔐 Admin Login</a>
    
    <div class="analytics-container">
        <div class="header">
            <h1 style="color: #00ff00; font-family: 'Courier New', monospace;">
                📊 SCREEPS ANALYTICS DASHBOARD
            </h1>
            <div class="date-selector">
                <button data-range="7" class="active">Last 7 Days</button>
                <button data-range="30">Last 30 Days</button>
                <button data-range="90">Last 90 Days</button>
                <button data-range="0">All Time</button>
            </div>
        </div>
        
        <div id="loading" class="loading">
            Loading telemetry data...
        </div>
        
        <div id="charts" class="charts-grid" style="display: none;">
            <div class="chart-container">
                <div class="chart-title">CPU USAGE TREND</div>
                <canvas id="cpuChart"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">ENERGY CAPACITY GROWTH</div>
                <canvas id="energyChart"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">RCL PROGRESSION</div>
                <canvas id="rclChart"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">CREEP POPULATION</div>
                <canvas id="creepChart"></canvas>
            </div>
        </div>
    </div>
    
    <script src="js/analytics-dashboard.js"></script>
</body>
</html>
